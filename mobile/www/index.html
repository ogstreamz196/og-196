<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OG BOT</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0d;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; letter-spacing: 0.02em; }
      p { margin: 0 0 1.5rem; color: #a1a1aa; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        background: #e11d2f;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>OG BOT</h1>
        <p>You're offline. Reconnect to carry on creating.</p>
        <a href="https://ogbot.co.uk">Try again</a>
      </div>
    </main>
  </body>
</html>
